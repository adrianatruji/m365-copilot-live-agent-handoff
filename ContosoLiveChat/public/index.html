<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contoso Live Chat – Agent desk</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 0; background: #f4f6f8; color: #1b1b1b; }
    header { background: #1F4E79; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; }
    header small { font-weight: 400; opacity: .8; margin-left: 10px; font-size: 13px; }
    main { display: flex; height: calc(100vh - 52px); }
    #list { width: 300px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; }
    .item { padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
    .item:hover, .item.active { background: #eaf2fb; }
    .item .name { font-weight: 600; }
    .item .meta { font-size: 12px; color: #666; }
    .badge { font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }
    .open { background: #dff6e5; color: #1d7a45; } .closed { background: #eee; color: #777; }
    #chat { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { max-width: 65%; margin: 6px 0; padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; }
    .user { background: #fff; border: 1px solid #ddd; }
    .agent { background: #1F4E79; color: #fff; margin-left: auto; }
    .system { background: transparent; color: #777; font-style: italic; font-size: 13px; text-align: center; max-width: 100%; }
    .msg .at { display: block; font-size: 11px; opacity: .6; margin-top: 3px; }
    form { display: flex; gap: 8px; padding: 14px 20px; background: #fff; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; background: #1F4E79; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
    #empty { margin: auto; color: #888; }
    #error { color: #b00020; font-size: 13px; padding: 0 20px 8px; }
  </style>
</head>
<body>
  <header>Contoso Live Chat <small>Agent desk · stand-in for your contact center (e.g. Genesys)</small></header>
  <main>
    <div id="list"></div>
    <div id="chat">
      <div id="messages"><div id="empty">Waiting for an escalation from Microsoft 365 Copilot…</div></div>
      <div id="error"></div>
      <form id="reply">
        <input id="text" placeholder="Reply as the human agent" autocomplete="off" disabled>
        <button id="send" disabled>Send</button>
      </form>
    </div>
  </main>
  <script>
    // Message text is only ever written with textContent (never innerHTML), so user input cannot inject markup.
    let selected = null
    let conversations = []

    const el = (tag, className, text) => { const e = document.createElement(tag); if (className) e.className = className; if (text !== undefined) e.textContent = text; return e }
    const time = (iso) => new Date(iso).toLocaleTimeString()

    function render () {
      const list = document.getElementById('list')
      list.replaceChildren(...conversations.map(c => {
        const item = el('div', 'item' + (c.id === selected ? ' active' : ''))
        const name = el('div', 'name', c.userName)
        name.append(el('span', 'badge ' + c.status, c.status))
        item.append(name, el('div', 'meta', `${time(c.startedAt)} · ${c.messages.length} messages`))
        item.onclick = () => { selected = c.id; render() }
        return item
      }))

      const conv = conversations.find(c => c.id === selected)
      const box = document.getElementById('messages')
      const open = conv && conv.status === 'open'
      document.getElementById('text').disabled = !open
      document.getElementById('send').disabled = !open
      if (!conv) return
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40
      box.replaceChildren(...conv.messages.map(m => {
        const d = el('div', 'msg ' + m.sender, m.text)
        d.append(el('span', 'at', `${m.sender} · ${time(m.at)}`))
        return d
      }))
      if (atBottom) box.scrollTop = box.scrollHeight
    }

    async function refresh () {
      try {
        conversations = await (await fetch('/api/chat/conversations')).json()
        if (!selected && conversations.length) selected = conversations[0].id
        render()
      } catch { /* app restarting */ }
    }

    document.getElementById('reply').onsubmit = async (e) => {
      e.preventDefault()
      const input = document.getElementById('text')
      const error = document.getElementById('error')
      if (!input.value.trim()) return
      error.textContent = ''
      const r = await fetch('/api/chat/send', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ conversationId: selected, message: input.value })
      })
      if (r.ok) input.value = ''
      else error.textContent = (await r.json()).error || 'Send failed'
      refresh()
    }

    refresh()
    setInterval(refresh, 2000)
  </script>
</body>
</html>
